
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Beautiful pictures of the world</p>
    </header>

    <div class="filters">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="nature">Nature</button>
        <button class="filter-btn" data-category="animals">Animals</button>
        <button class="filter-btn" data-category="architecture">Architecture</button>
    </div>

    <div class="gallery">

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=600&q=80" alt="Mountain lake">
            <h3>Beautiful Mountains</h3>
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=600&q=80" alt="Cat">
            <h3>Cute Cat</h3>
        </div>

        <div class="gallery-item" data-category="architecture">
            <img src="https://images.unsplash.com/photo-1487958449943-2429e8be8625?auto=format&fit=crop&w=600&q=80" alt="Modern house">
            <h3>Modern House</h3>
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=600&q=80" alt="Green forest">
            <h3>Green Forest</h3>
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1543852786-1cf6624b9987?auto=format&fit=crop&w=600&q=80" alt="Kitten">
            <h3>Little Kitten</h3>
        </div>

        <div class="gallery-item" data-category="architecture">
            <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=600&q=80" alt="Building">
            <h3>Beautiful Building</h3>
        </div>

    </div>

    <div class="lightbox" id="lightbox">
        <button id="closeBtn" class="close-btn">&times;</button>
        <button id="prevBtn" class="nav-btn">&#10094;</button>
        <img id="lightboxImage" src="" alt="Large preview">
        <button id="nextBtn" class="nav-btn">&#10095;</button>
        <p id="caption"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
